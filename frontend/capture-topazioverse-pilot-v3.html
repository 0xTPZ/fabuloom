<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <title>Topazioverse · piloto V3</title>
    <style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style>
  </head>
  <body>
    <canvas id="capture-canvas" width="1920" height="1080"></canvas>
    <pre id="status">initializing</pre>
    <script type="module">
      import {
        NarratorAvatarRenderer,
        NARRATOR_FACE_CROP,
        createNarratorTimeline,
        validateNarratorManifest,
        segmentAt
      } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";

      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const timelineUrl = params.get("timeline");
      const fps = Number(params.get("fps") || 15);
      const canvas = document.querySelector("#capture-canvas");
      const context = canvas.getContext("2d");
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const status = document.querySelector("#status");
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };

      async function readPcm16Wav(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`audio request failed with HTTP ${response.status}`);
        return decodeMonoPcm16Wav(await response.arrayBuffer());
      }

      function exportUrl(value) {
        const normalized = decodeURIComponent(String(value)).replaceAll("\\", "/");
        const marker = "/workspace/exports/";
        const index = normalized.toLowerCase().indexOf(marker);
        if (index < 0) throw new Error(`asset is outside workspace exports: ${value}`);
        const relative = normalized.slice(index + marker.length).replace(/^\/+/, "");
        const parts = relative.split("/");
        if (!relative || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe export asset: ${value}`);
        return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`;
      }

      function sceneWeight(timeMs, scene, index, scenes, fadeMs) {
        if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0;
        let value = 1;
        if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) value = Math.min(value, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs);
        if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) value = Math.min(value, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs);
        return clamp(value);
      }

      function coverImage(image, timeMs, scene, alpha) {
        const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms));
        const base = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight);
        let zoom = 1, panX = 0, panY = 0;
        if (scene.camera === "stillness_zoom") { zoom = 1 + progress * 0.065; panX = progress * 0.012; }
        else if (scene.camera === "crystal_approach") { zoom = 1 + progress * 0.105; panY = progress * 0.012; }
        else if (scene.camera === "thaurion_push") { zoom = 1 + progress * 0.075; panX = progress * 0.022; }
        else if (scene.camera === "wind_lateral") { zoom = 1.035; panX = -0.075 + progress * 0.15; panY = progress * 0.012; }
        else if (scene.camera === "snow_breath") { zoom = 1 + progress * 0.055; panX = -progress * 0.018; }
        const scale = base * zoom;
        const width = image.naturalWidth * scale, height = image.naturalHeight * scale;
        const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH);
        const y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT);
        context.save();
        context.globalAlpha = alpha;
        context.drawImage(image, x, y, width, height);
        const pulse = (Math.sin(progress * Math.PI * 6) + 1) / 2;
        if (scene.camera === "crystal_approach") {
          const glow = context.createRadialGradient(WIDTH * .52, HEIGHT * .38, 20, WIDTH * .52, HEIGHT * .38, 560);
          glow.addColorStop(0, `rgba(86,170,255,${0.07 + pulse * 0.12})`); glow.addColorStop(1, "rgba(86,170,255,0)");
          context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT);
        }
        if (scene.camera === "snow_breath") { context.fillStyle = `rgba(210,236,255,${0.04 + pulse * 0.035})`; context.fillRect(0, 0, WIDTH, HEIGHT); }
        context.restore();
      }

      function drawParticles(scene, timeMs, alpha = 1) {
        if (!["thaurion_push", "snow_breath"].includes(scene.camera)) return;
        context.save(); context.globalAlpha = alpha * (scene.camera === "snow_breath" ? 0.36 : 0.22); context.fillStyle = "#dcecff";
        for (let index = 0; index < 26; index += 1) {
          const phase = index * 1.731;
          const x = (index * 137 + timeMs * (0.008 + (index % 3) * 0.002)) % WIDTH;
          const y = (index * 73 + Math.sin(timeMs / 800 + phase) * 22 + 90) % (HEIGHT - 150);
          context.beginPath(); context.arc(x, y, 1 + (index % 3) * 0.6, 0, Math.PI * 2); context.fill();
        }
        context.restore();
      }

      function drawStoryScene(images, scenes, timeMs) {
        let activeScene = null;
        scenes.forEach((scene, index) => {
          const weight = sceneWeight(timeMs, scene, index, scenes, 800);
          if (weight > 0) { coverImage(images[scene.id], timeMs, scene, weight); if (!activeScene || weight > activeScene.weight) activeScene = { scene, weight }; }
        });
        if (activeScene) drawParticles(activeScene.scene, timeMs, activeScene.weight);
      }

      function wrap(text, maxWidth, font = "600 30px Segoe UI") {
        const words = String(text).split(/\s+/), lines = []; let line = "";
        context.font = font;
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (line && context.measureText(candidate).width > maxWidth) { lines.push(line); line = word; } else line = candidate;
        }
        if (line) lines.push(line);
        return lines;
      }

      function drawAvatar(avatar, timeMs, amplitude, x, y, size, alpha = 1) {
        context.save(); context.globalAlpha = alpha;
        context.fillStyle = "rgba(3,10,24,.74)"; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + 20, 0, Math.PI * 2); context.fill();
        context.strokeStyle = "rgba(247,210,122,.94)"; context.lineWidth = 5; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + 14, 0, Math.PI * 2); context.stroke();
        context.restore();
        avatar.renderTo(context, { x, y, size, timeMs, speechAmplitude: amplitude, isPlaying: true, crop: NARRATOR_FACE_CROP });
      }

      function drawSubtitle(segment, hostMode = false) {
        if (!segment) return;
        const x = hostMode ? 1350 : 1270, width = hostMode ? 1120 : 1180, y = hostMode ? 790 : 842;
        const lines = wrap(segment.text, width - 70, hostMode ? "600 28px Segoe UI" : "600 30px Segoe UI");
        const height = lines.length * (hostMode ? 40 : 42) + 38;
        context.save(); context.fillStyle = "rgba(3,12,28,.89)"; context.fillRect(x - width / 2, y - 22, width, height);
        context.strokeStyle = "rgba(247,210,122,.76)"; context.lineWidth = 2; context.strokeRect(x - width / 2, y - 22, width, height);
        context.fillStyle = "#fff7dc"; context.textAlign = "center"; context.textBaseline = "top";
        lines.forEach((line, index) => { context.font = hostMode ? "600 28px Segoe UI" : "600 30px Segoe UI"; context.fillText(line, x, y + index * (hostMode ? 40 : 42)); });
        context.restore();
      }

      function drawHostBackdrop(timeMs, outro = false) {
        const gradient = context.createLinearGradient(0, 0, WIDTH, HEIGHT);
        gradient.addColorStop(0, outro ? "#071426" : "#091a31"); gradient.addColorStop(0.58, "#102a48"); gradient.addColorStop(1, "#030914");
        context.fillStyle = gradient; context.fillRect(0, 0, WIDTH, HEIGHT);
        const glow = context.createRadialGradient(560, 300, 20, 560, 300, 460);
        glow.addColorStop(0, `rgba(247,210,122,${0.12 + Math.sin(timeMs / 900) * 0.025})`); glow.addColorStop(1, "rgba(247,210,122,0)");
        context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT);
        context.fillStyle = "rgba(7,18,35,.88)"; context.fillRect(0, 820, WIDTH, 260);
        for (let shelf = 0; shelf < 4; shelf += 1) {
          const y = 142 + shelf * 158; context.fillStyle = "rgba(247,210,122,.14)"; context.fillRect(0, y, WIDTH, 7);
          for (let book = 0; book < 18; book += 1) {
            const x = 42 + book * 112 + (shelf % 2) * 28;
            const h = 74 + ((book * 17 + shelf * 11) % 48);
            context.fillStyle = ["#183f67", "#72552c", "#254d53", "#3c2f57"][book % 4]; context.fillRect(x, y - h, 68, h - 12);
          }
        }
        context.fillStyle = "rgba(247,210,122,.23)"; context.fillRect(1120, 102, 2, 650);
        context.fillStyle = "#f7d27a"; context.font = "700 34px Segoe UI"; context.textAlign = "left"; context.fillText("TOPAZIOVERSE", 1200, 154);
        context.fillStyle = "#dcecff"; context.font = "24px Segoe UI"; context.fillText(outro ? "Obrigado por viajar conosco" : "Uma história está prestes a começar", 1200, 198);
      }

      function drawHostCard(outro = false) {
        context.save(); context.fillStyle = "rgba(3,12,28,.76)"; context.fillRect(1160, 248, 650, 214);
        context.strokeStyle = "rgba(247,210,122,.62)"; context.lineWidth = 2; context.strokeRect(1160, 248, 650, 214);
        context.fillStyle = "#f7d27a"; context.font = "700 28px Segoe UI"; context.textAlign = "left"; context.fillText("SANTA", 1200, 304);
        context.fillStyle = "#fff7dc"; context.font = "700 40px Segoe UI"; context.fillText(outro ? "Até a próxima aventura" : "Anfitrião do Topazioverse", 1200, 366);
        context.fillStyle = "#dcecff"; context.font = "23px Segoe UI"; context.fillText(outro ? "Obrigado, Guardiões" : "Capítulo 1 · O Despertar dos Cristais", 1200, 414);
        context.restore();
      }

      function drawStoryTitle(timeMs, storyStart) {
        const relative = timeMs - storyStart;
        if (relative < 0 || relative > 5600) return;
        const alpha = clamp(Math.min((5200 - relative) / 1100, 1));
        context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.62)"; context.fillRect(82, 76, 1050, 188);
        context.textAlign = "left"; context.fillStyle = "#f7d27a"; context.font = "700 36px Segoe UI"; context.fillText("TOPAZIOVERSE", 122, 126);
        context.fillStyle = "#fff7dc"; context.font = "700 48px Segoe UI"; context.fillText("O DESPERTAR DOS CRISTAIS", 122, 184);
        context.fillStyle = "#dcecff"; context.font = "24px Segoe UI"; context.fillText("CAPÍTULO 1 — A NOITE EM QUE TOPÁZIO PAROU", 122, 228); context.restore();
      }

      function drawStoryEnding(timeMs, storyEnd) {
        const relative = timeMs - storyEnd;
        if (relative < -5600) return;
        const alpha = clamp((relative + 5600) / 900);
        context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.68)"; context.fillRect(1140, 74, 690, 130);
        context.textAlign = "right"; context.fillStyle = "#f7d27a"; context.font = "700 30px Segoe UI"; context.fillText("O DESPERTAR DOS CRISTAIS", 1785, 126);
        context.fillStyle = "#dcecff"; context.font = "22px Segoe UI"; context.fillText("PILOTO · TRILHA ORIGINAL DO DESPERTAR", 1785, 166); context.restore();
      }

      function renderScene(images, plan, avatar, timeline, amplitudeAt, timeMs) {
        const [intro, story, outro] = plan.editorial_blocks;
        const segment = segmentAt(timeline, timeMs);
        const inIntroTransition = timeMs >= intro.audio_end_ms && timeMs < story.start_ms;
        const inOutroTransition = timeMs >= story.audio_end_ms && timeMs < outro.start_ms;
        const hostIntro = timeMs < intro.audio_end_ms;
        const hostOutro = timeMs >= outro.start_ms;
        if (hostIntro || inIntroTransition) {
          drawHostBackdrop(timeMs, false);
          if (inIntroTransition) {
            const progress = clamp((timeMs - intro.audio_end_ms) / Math.max(1, intro.transition_after_ms));
            drawStoryScene(images, plan.scenes, story.start_ms);
            drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 56, 658, 332, progress);
            drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 430, 164, 610, 1 - progress);
          } else {
            drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 430, 164, 610);
            drawHostCard(false); drawSubtitle(segment, true);
          }
          return;
        }
        if (hostOutro || inOutroTransition) {
          if (inOutroTransition) {
            const progress = clamp((timeMs - story.audio_end_ms) / Math.max(1, story.transition_after_ms));
            drawStoryScene(images, plan.scenes, timeMs); drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 56, 658, 332, 1 - progress);
            context.save(); context.globalAlpha = progress; drawHostBackdrop(timeMs, true); context.restore();
            drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 430, 164, 610, progress);
          } else {
            drawHostBackdrop(timeMs, true); drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 430, 164, 610); drawHostCard(true); drawSubtitle(segment, true);
          }
          return;
        }
        drawStoryScene(images, plan.scenes, timeMs); drawStoryTitle(timeMs, story.start_ms); drawStoryEnding(timeMs, story.audio_end_ms);
        drawAvatar(avatar, timeMs, amplitudeAt(timeMs), 56, 658, 332); drawSubtitle(segment, false);
      }

      function sendFrame(index, timeMs) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(async (blob) => {
            if (!blob) { reject(new Error("JPEG encoding failed")); return; }
            try {
              const response = await fetch(`/capture/${encodeURIComponent(session)}/src-${String(index).padStart(6, "0")}.jpg`, { method: "POST", headers: { "Content-Type": "image/jpeg", "X-Frame-Time-Ms": String(timeMs) }, body: blob });
              if (!response.ok) throw new Error(`frame ${index} upload failed with HTTP ${response.status}`);
              resolve();
            } catch (error) { reject(error); }
          }, "image/jpeg", 0.88);
        });
      }

      async function main() {
        if (!session || !timelineUrl) fail("session and timeline are required");
        if (!Number.isInteger(fps) || fps <= 0 || fps > 60) fail("invalid fps");
        const planResponse = await fetch(timelineUrl); if (!planResponse.ok) fail(`timeline request failed with HTTP ${planResponse.status}`);
        const plan = await planResponse.json();
        const manifestResponse = await fetch(`/exports/${plan.manifest}`); if (!manifestResponse.ok) fail(`manifest request failed with HTTP ${manifestResponse.status}`);
        const manifest = await manifestResponse.json(); validateNarratorManifest(manifest);
        const wavs = await Promise.all(manifest.segments.map((segment) => readPcm16Wav(exportUrl(segment.audio_uri))));
        const sampleRate = wavs[0].sampleRate;
        const amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate);
        const images = {};
        for (const scene of plan.scenes) {
          const image = document.createElement("img"); image.src = `/exports/${scene.image}`;
          await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`scene image failed: ${scene.image}`)); });
          images[scene.id] = image;
        }
        const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load();
        const timeline = createNarratorTimeline(manifest);
        const frameCount = Math.ceil(manifest.duration_ms / 1000 * fps); const pendingUploads = new Set();
        for (let index = 0; index < frameCount; index += 1) {
          const timeMs = Math.round(index * 1000 / fps); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#030914"; context.fillRect(0, 0, WIDTH, HEIGHT);
          renderScene(images, plan, avatar, timeline, amplitudeAt, timeMs);
          const upload = sendFrame(index, timeMs); pendingUploads.add(upload); upload.then(() => pendingUploads.delete(upload), () => pendingUploads.delete(upload));
          if (pendingUploads.size >= 12) await Promise.race(pendingUploads);
        }
        await Promise.all(pendingUploads);
        const completion = {
          mode: "topazioverse-book1-episode1-pilot-v3", duration_ms: manifest.duration_ms, sample_rate: sampleRate,
          canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, output_fps: 30,
          timing_source: "measured_host_and_story_wav_segments_plus_explicit_editorial_pauses",
          mouth_source: "pcm16_rms_envelope", captions: "measured_segment_ranges", narrator_visibility: "entire_program",
          editorial_blocks: plan.editorial_blocks.map((block) => block.id), word_phoneme_viseme_timing: "unavailable"
        };
        const complete = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(completion) });
        if (!complete.ok) fail(`completion upload failed with HTTP ${complete.status}`);
        status.textContent = JSON.stringify(completion); document.title = "completed";
      }
      main().catch((error) => {
        console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`;
        if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {});
      });
    </script>
  </body>
</html>
