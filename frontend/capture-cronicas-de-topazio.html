<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <title>Crônicas de Topázio · captura</title>
    <style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style>
  </head>
  <body>
    <canvas id="capture-canvas"></canvas>
    <pre id="status">initializing</pre>
    <script type="module">
      import { NarratorAvatarRenderer, NARRATOR_FACE_CROP, createNarratorTimeline, validateNarratorManifest, segmentAt } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";

      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const timelineUrl = params.get("timeline");
      const fps = Number(params.get("fps") || 15);
      const canvas = document.querySelector("#capture-canvas");
      canvas.width = 1920; canvas.height = 1080;
      const context = canvas.getContext("2d");
      const WIDTH = canvas.width, HEIGHT = canvas.height;
      const status = document.querySelector("#status");
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };

      async function readPcm16Wav(url) {
        const response = await fetch(url); if (!response.ok) throw new Error(`audio request failed: ${response.status}`);
        return decodeMonoPcm16Wav(await response.arrayBuffer());
      }

      function exportUrl(value) {
        const normalized = decodeURIComponent(String(value)).replaceAll("\\", "/");
        const marker = "/workspace/exports/", index = normalized.toLowerCase().indexOf(marker);
        if (index < 0) throw new Error(`audio asset outside workspace exports: ${value}`);
        const relative = normalized.slice(index + marker.length).replace(/^\/+/, "");
        const parts = relative.split("/");
        if (!relative || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe audio asset: ${value}`);
        return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`;
      }

      function relativeExport(value) {
        const parts = String(value).split("/");
        if (!value || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe image asset: ${value}`);
        return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`;
      }

      function sceneWeight(timeMs, scene, index, scenes, fadeMs = 700) {
        if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0;
        let weight = 1;
        if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) weight = Math.min(weight, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs);
        if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) weight = Math.min(weight, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs);
        return clamp(weight);
      }

      function progress(timeMs, scene) { return clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms)); }

      function drawParticles(timeMs, amount = 34, color = "#bfeaff", speed = 0.006, alpha = 0.55) {
        context.save(); context.globalAlpha = alpha; context.fillStyle = color;
        for (let index = 0; index < amount; index += 1) {
          const x = (index * 139 + timeMs * (speed + (index % 4) * 0.001)) % WIDTH;
          const y = (index * 71 + Math.sin(timeMs / 720 + index * 1.2) * 30 + 28) % HEIGHT;
          context.beginPath(); context.arc(x, y, 1.2 + (index % 3) * 0.65, 0, Math.PI * 2); context.fill();
        }
        context.restore();
      }

      function drawHostBackdrop(timeMs) {
        const gradient = context.createLinearGradient(0, 0, WIDTH, HEIGHT);
        gradient.addColorStop(0, "#071426"); gradient.addColorStop(0.62, "#132f4b"); gradient.addColorStop(1, "#020812");
        context.fillStyle = gradient; context.fillRect(0, 0, WIDTH, HEIGHT);
        context.fillStyle = "rgba(3,10,22,.84)"; context.fillRect(0, 780, WIDTH, 300);
        for (let shelf = 0; shelf < 4; shelf += 1) {
          const y = 115 + shelf * 165; context.fillStyle = "rgba(247,210,122,.16)"; context.fillRect(0, y, WIDTH, 6);
          for (let book = 0; book < 18; book += 1) {
            const x = 35 + book * 111 + (shelf % 2) * 18, h = 68 + ((book * 17 + shelf * 11) % 50);
            context.fillStyle = ["#183f67", "#76552c", "#244e54", "#3b3159"][book % 4]; context.fillRect(x, y - h, 66, h - 10);
          }
        }
        const glow = context.createRadialGradient(1330, 260, 20, 1330, 260, 530);
        glow.addColorStop(0, `rgba(247,210,122,${0.12 + Math.sin(timeMs / 900) * 0.02})`); glow.addColorStop(1, "rgba(247,210,122,0)");
        context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT); drawParticles(timeMs, 38, "#dcecff", 0.006, 0.55);
      }

      function drawLockup(timeMs) {
        const gradient = context.createRadialGradient(WIDTH / 2, 390, 20, WIDTH / 2, 390, 860);
        gradient.addColorStop(0, "#174b76"); gradient.addColorStop(1, "#020812"); context.fillStyle = gradient; context.fillRect(0, 0, WIDTH, HEIGHT);
        drawParticles(timeMs, 50, "#cfefff", 0.008, 0.6);
        context.textAlign = "center"; context.fillStyle = "#f7d27a"; context.font = "700 76px Segoe UI"; context.fillText("CRÔNICAS DE TOPÁZIO", WIDTH / 2, 365);
        context.fillStyle = "#fff7dc"; context.font = "600 40px Segoe UI"; context.fillText("um portal para histórias fantásticas", WIDTH / 2, 445);
        context.fillStyle = "#91d9ff"; context.font = "500 28px Segoe UI"; context.fillText("lendas · personagens · magia · aventuras", WIDTH / 2, 505);
      }

      function drawImageCover(image, timeMs, scene, alpha) {
        const p = progress(timeMs, scene), camera = scene.camera || {};
        const base = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight);
        const zoom = Number(camera.zoom || 1) + p * 0.035;
        const width = image.naturalWidth * base * zoom, height = image.naturalHeight * base * zoom;
        const panX = Number(camera.pan_x || 0) + Math.sin(p * Math.PI) * 0.015, panY = Number(camera.pan_y || 0) + Math.cos(p * Math.PI) * 0.008;
        const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH), y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT);
        context.save(); context.globalAlpha = alpha; context.drawImage(image, x, y, width, height); context.restore();
      }

      function drawEffect(effect, timeMs, alpha) {
        context.save(); context.globalAlpha = alpha;
        if (effect === "crystal" || effect === "elemental") {
          const pulse = 0.22 + Math.sin(timeMs / 380) * 0.06, glow = context.createRadialGradient(960, 430, 20, 960, 430, 660);
          glow.addColorStop(0, `rgba(84,190,255,${pulse})`); glow.addColorStop(1, "rgba(84,190,255,0)"); context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT);
          if (effect === "elemental") { context.strokeStyle = "rgba(247,210,122,.52)"; context.lineWidth = 3; for (let index = 0; index < 3; index += 1) { context.beginPath(); context.arc(960, 460, 180 + index * 78 + Math.sin(timeMs / 500 + index) * 12, timeMs / 800 + index, timeMs / 800 + Math.PI * 1.35 + index); context.stroke(); } }
        } else if (effect === "freeze") {
          context.strokeStyle = "rgba(176,227,255,.34)"; context.lineWidth = 2; for (let index = 0; index < 6; index += 1) { context.beginPath(); context.arc(960, 420, 90 + index * 90, timeMs / 1500 + index, timeMs / 1500 + Math.PI * 1.1 + index); context.stroke(); }
          drawParticles(timeMs, 24, "#e2f6ff", 0.001, 0.45);
        } else if (effect === "wind") {
          context.strokeStyle = "rgba(154,222,255,.42)"; context.lineWidth = 4;
          for (let index = 0; index < 6; index += 1) { context.beginPath(); context.moveTo(-60, 220 + index * 120); context.bezierCurveTo(430, 120 + index * 70, 900, 520 - index * 45, 1980, 260 + index * 110); context.stroke(); }
          drawParticles(timeMs, 34, "#bdeaff", 0.018, 0.52);
        } else if (effect === "ember") {
          const glow = context.createRadialGradient(480, 720, 10, 480, 720, 620); glow.addColorStop(0, "rgba(255,144,55,.24)"); glow.addColorStop(1, "rgba(255,80,20,0)"); context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT); drawParticles(timeMs, 25, "#ffc475", 0.011, 0.5);
        } else if (effect === "forest") {
          drawParticles(timeMs, 42, "#9ee9c6", 0.003, 0.42);
        } else if (effect === "snow") {
          drawParticles(timeMs, 48, "#f2fbff", 0.001, 0.48);
        } else {
          drawParticles(timeMs, 24, "#cfefff", 0.004, 0.34);
        }
        context.restore();
      }

      function drawScene(scene, image, timeMs, alpha) {
        context.save(); context.globalAlpha = alpha;
        if (scene.visual === "host") drawHostBackdrop(timeMs);
        else if (scene.visual === "lockup") drawLockup(timeMs);
        else if (image) drawImageCover(image, timeMs, scene, 1);
        else { context.fillStyle = "#071426"; context.fillRect(0, 0, WIDTH, HEIGHT); }
        context.restore(); drawEffect(scene.effect, timeMs, alpha);
      }

      function drawAvatar(avatar, timeMs, amplitude, placement) {
        const values = placement === "host"
          ? { x: 1190, y: 130, size: 660 }
          : placement === "lockup"
            ? { x: 1390, y: 205, size: 500 }
            : { x: 54, y: 650, size: 300 };
        context.save(); context.fillStyle = "rgba(3,10,24,.78)"; context.beginPath(); context.arc(values.x + values.size / 2, values.y + values.size / 2, values.size / 2 + 20, 0, Math.PI * 2); context.fill(); context.strokeStyle = "rgba(247,210,122,.94)"; context.lineWidth = 5; context.beginPath(); context.arc(values.x + values.size / 2, values.y + values.size / 2, values.size / 2 + 14, 0, Math.PI * 2); context.stroke(); context.restore();
        avatar.renderTo(context, { x: values.x, y: values.y, size: values.size, timeMs, speechAmplitude: amplitude, isPlaying: true, crop: NARRATOR_FACE_CROP });
      }

      function drawSubtitle(segment) {
        if (!segment) return;
        const width = 1460, x = 1110, y = 895, fontSize = 30;
        context.font = `600 ${fontSize}px Segoe UI`;
        const lines = []; let line = "";
        for (const word of String(segment.text).split(/\s+/)) { const candidate = line ? `${line} ${word}` : word; if (line && context.measureText(candidate).width > width - 70) { lines.push(line); line = word; } else line = candidate; }
        if (line) lines.push(line);
        const height = lines.length * (fontSize + 11) + 34;
        context.save(); context.fillStyle = "rgba(3,12,28,.90)"; context.fillRect(x - width / 2, y - 24, width, height); context.strokeStyle = "rgba(247,210,122,.82)"; context.lineWidth = 2; context.strokeRect(x - width / 2, y - 24, width, height); context.fillStyle = "#fff7dc"; context.textAlign = "center"; context.textBaseline = "top"; lines.forEach((entry, index) => context.fillText(entry, x, y + index * (fontSize + 11))); context.restore();
      }

      function sendFrame(index, timeMs) {
        return new Promise((resolve, reject) => canvas.toBlob(async (blob) => { if (!blob) { reject(new Error("JPEG encoding failed")); return; } try { const response = await fetch(`/capture/${encodeURIComponent(session)}/src-${String(index).padStart(6, "0")}.jpg`, { method: "POST", headers: { "Content-Type": "image/jpeg", "X-Frame-Time-Ms": String(timeMs) }, body: blob }); if (!response.ok) throw new Error(`frame upload failed: ${response.status}`); resolve(); } catch (error) { reject(error); } }, "image/jpeg", 0.90));
      }

      async function main() {
        if (!session || !timelineUrl) fail("session and timeline are required");
        const planResponse = await fetch(timelineUrl); if (!planResponse.ok) fail(`timeline request failed: ${planResponse.status}`);
        const plan = await planResponse.json(); const manifestResponse = await fetch(`/exports/${plan.manifest}`); if (!manifestResponse.ok) fail(`manifest request failed: ${manifestResponse.status}`);
        const manifest = await manifestResponse.json(); validateNarratorManifest(manifest);
        const wavs = await Promise.all(manifest.segments.map((segment) => readPcm16Wav(exportUrl(segment.audio_uri))));
        const sampleRate = wavs[0].sampleRate, amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate);
        const images = {};
        for (const scene of plan.scenes) if (scene.asset_path) { const image = document.createElement("img"); image.src = relativeExport(scene.asset_path); await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`image failed: ${scene.asset_path}`)); }); images[scene.id] = image; }
        const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load();
        const measuredTimeline = createNarratorTimeline(manifest), frameCount = Math.ceil(manifest.duration_ms / 1000 * fps), pending = new Set();
        for (let index = 0; index < frameCount; index += 1) {
          const timeMs = Math.round(index * 1000 / fps); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#020812"; context.fillRect(0, 0, WIDTH, HEIGHT);
          let active = null;
          plan.scenes.forEach((scene, sceneIndex) => { const weight = sceneWeight(timeMs, scene, sceneIndex, plan.scenes); if (weight > 0) { drawScene(scene, images[scene.id], timeMs, weight); if (!active || weight > active.weight) active = { scene, weight }; } });
          const visual = active?.scene.visual;
          drawAvatar(avatar, timeMs, amplitudeAt(timeMs), visual === "host" ? "host" : visual === "lockup" ? "lockup" : "medallion");
          drawSubtitle(segmentAt(measuredTimeline, timeMs));
          const upload = sendFrame(index, timeMs); pending.add(upload); upload.then(() => pending.delete(upload), () => pending.delete(upload)); if (pending.size >= 12) await Promise.race(pending);
        }
        await Promise.all(pending);
        const completion = { mode: "cronicas-de-topazio-channel-intro", duration_ms: manifest.duration_ms, sample_rate: sampleRate, canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, output_fps: 30, timing_source: "measured_kokoro_wav_segments", mouth_source: "pcm16_rms_envelope", word_phoneme_viseme_timing: "unavailable", narrator_visibility: "entire_program" };
        const complete = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(completion) }); if (!complete.ok) fail(`completion upload failed: ${complete.status}`); status.textContent = JSON.stringify(completion); document.title = "completed";
      }
      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {}); });
    </script>
  </body>
</html>
