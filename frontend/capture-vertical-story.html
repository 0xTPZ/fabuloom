<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"/><title>Fabuloom vertical story capture</title><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style></head>
  <body><canvas id="capture-canvas" width="1080" height="1920"></canvas><pre id="status">initializing</pre>
    <script type="module">
      import { NarratorAvatarRenderer, NARRATOR_FACE_CROP, createNarratorTimeline, segmentAt, mouthStateAt } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";
      import { validateVerticalStoryProfile } from "./src/vertical-story-profile.mjs";

      const params = new URLSearchParams(location.search); const session = params.get("session"); const profileUrl = params.get("profile"); const fps = Number(params.get("fps") || 30); const canvas = document.querySelector("#capture-canvas"); const context = canvas.getContext("2d"); const status = document.querySelector("#status"); const WIDTH = canvas.width; const HEIGHT = canvas.height;
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const safeAssetUrl = (relative) => { const parts = String(relative).split("/"); if (!parts.length || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe asset path: ${relative}`); return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`; };
      async function readWav(url) { const response = await fetch(url); if (!response.ok) throw new Error(`audio request failed: ${response.status}`); try { return decodeMonoPcm16Wav(await response.arrayBuffer()); } catch (error) { throw new Error(`${error.message} for ${url}`); } }
      function sceneWeight(timeMs, scene, index, scenes, fadeMs) { if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0; let value = 1; if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) value = Math.min(value, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs); if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) value = Math.min(value, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs); return clamp(value); }
      function coverImage(image, timeMs, scene, alpha) { const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms)); const scale = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight) * (1 + (scene.camera === "zoom_in" || scene.camera === "crystal_approach" ? progress * .09 : .035)); let panX = 0; let panY = 0; if (scene.camera === "pan_vertical") panY = -.12 + progress * .24; if (scene.camera === "pan_lateral") panX = -.10 + progress * .20; const width = image.naturalWidth * scale; const height = image.naturalHeight * scale; const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH); const y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT); context.save(); context.globalAlpha = alpha; context.drawImage(image, x, y, width, height); if (scene.effect === "crystal_pulse") { const pulse = (Math.sin(progress * Math.PI * 7) + 1) / 2; const glow = context.createRadialGradient(WIDTH * .5, HEIGHT * .42, 30, WIDTH * .5, HEIGHT * .42, 520); glow.addColorStop(0, `rgba(48,143,255,${.08 + pulse * .16})`); glow.addColorStop(1, "rgba(48,143,255,0)"); context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT); } if (scene.effect === "darken") { context.fillStyle = `rgba(0,3,12,${.08 + progress * .25})`; context.fillRect(0, 0, WIDTH, HEIGHT); } context.restore(); }
      function particles(timeMs, scene, alpha) { if (scene.effect !== "particles") return; const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms)); context.save(); context.globalAlpha = alpha * .38; for (let index = 0; index < 18; index += 1) { const x = (Math.sin(index * 12.7 + progress * 1.8) * .5 + .5) * WIDTH; const y = (index * 137 + progress * (90 + index * 3)) % HEIGHT; const radius = 1.2 + (index % 3) * .8; context.fillStyle = index % 2 ? "#8dc9ff" : "#f7d27a"; context.beginPath(); context.arc(x, y, radius, 0, Math.PI * 2); context.fill(); } context.restore(); }
      function wrap(text, width, font) { const words = String(text).split(/\s+/); const lines = []; let line = ""; context.font = font; for (const word of words) { const candidate = line ? `${line} ${word}` : word; if (line && context.measureText(candidate).width > width) { lines.push(line); line = word; } else line = candidate; } if (line) lines.push(line); return lines; }
      function drawSubtitle(segment, profile) { if (!segment) return; const s = profile.subtitles; const lines = wrap(segment.text, s.width - 56, `700 ${s.font_size}px Segoe UI`); const maxLines = s.max_lines || 3; const visible = lines.slice(0, maxLines); const height = visible.length * s.line_height + 34; context.save(); context.fillStyle = "rgba(3,12,28,.86)"; context.fillRect(s.x - s.width / 2, s.y, s.width, height); context.strokeStyle = "rgba(247,210,122,.88)"; context.lineWidth = 2; context.strokeRect(s.x - s.width / 2, s.y, s.width, height); context.fillStyle = "#fff7dc"; context.textAlign = "center"; context.textBaseline = "top"; visible.forEach((line, index) => context.fillText(line, s.x, s.y + 17 + index * s.line_height)); context.restore(); }
      function drawTitle(profile, timeMs) { const alpha = clamp(Math.min((2600 - timeMs) / 800, 1)); if (alpha <= 0) return; context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,12,28,.72)"; context.fillRect(60, 94, 960, 170); context.fillStyle = "#f7d27a"; context.font = "700 48px Segoe UI"; context.fillText(profile.title, 92, 152); context.fillStyle = "#dcecff"; context.font = "26px Segoe UI"; context.fillText("UMA HISTÓRIA DO TOPAZIOVERSE", 94, 210); context.restore(); }
      function drawEndCard(profile, timeMs) { if (timeMs < profile.duration_ms - 2200) return; const progress = clamp((timeMs - (profile.duration_ms - 2200)) / 2200); context.save(); context.globalAlpha = progress; context.fillStyle = "rgba(0,0,0,.82)"; context.fillRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#f7d27a"; context.font = "700 54px Segoe UI"; context.textAlign = "center"; context.fillText("FABULOOM", WIDTH / 2, HEIGHT / 2); context.restore(); }
      async function sendFrame(index, timeMs) { const blob = await new Promise((resolve, reject) => canvas.toBlob((value) => value ? resolve(value) : reject(new Error("PNG encoding failed")), "image/png")); const response = await fetch(`/capture/${encodeURIComponent(session)}/${String(index).padStart(6, "0")}.png`, { method: "POST", headers: { "Content-Type": "image/png", "X-Frame-Time-Ms": String(timeMs) }, body: blob }); if (!response.ok) throw new Error(`frame upload failed: ${response.status}`); }

      async function main() {
        if (!session || !profileUrl) fail("session and profile are required"); if (fps !== 30) fail("vertical profile requires 30 FPS");
        const profileResponse = await fetch(profileUrl); if (!profileResponse.ok) fail(`profile request failed: ${profileResponse.status}`); const profile = validateVerticalStoryProfile(await profileResponse.json());
        const manifestResponse = await fetch(safeAssetUrl(profile.manifest)); if (!manifestResponse.ok) fail(`manifest request failed: ${manifestResponse.status}`); const manifest = await manifestResponse.json();
        const wavs = await Promise.all(manifest.segments.map((segment) => readWav(safeAssetUrl(segment.audio_uri.replace(/^.*vertical-story-v1\//, "vertical-story-v1/"))))); const sampleRate = wavs[0].sampleRate; if (wavs.some((wav) => wav.sampleRate !== sampleRate)) fail("WAV sample rates differ");
        const amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate); const timeline = createNarratorTimeline(manifest); const images = {};
        for (const scene of profile.scenes) { const image = document.createElement("img"); image.src = safeAssetUrl(scene.image); await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`scene image failed: ${scene.image}`)); }); images[scene.id] = image; }
        const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load(); const frameCount = Math.ceil(manifest.duration_ms / 1000 * fps);
        for (let index = 0; index < frameCount; index += 1) { const timeMs = Math.round(index * 1000 / fps); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#030914"; context.fillRect(0, 0, WIDTH, HEIGHT); profile.scenes.forEach((scene, sceneIndex) => { const weight = sceneWeight(timeMs, scene, sceneIndex, profile.scenes, profile.transitions.crossfade_ms); if (weight > 0) { coverImage(images[scene.id], timeMs, scene, weight); particles(timeMs, scene, weight); } }); drawTitle(profile, timeMs); avatar.renderTo(context, { x: profile.narrator.x, y: profile.narrator.y, size: profile.narrator.size, timeMs, speechAmplitude: amplitudeAt(timeMs), isPlaying: true, crop: NARRATOR_FACE_CROP }); drawSubtitle(segmentAt(timeline, timeMs), profile); drawEndCard({ ...profile, duration_ms: manifest.duration_ms }, timeMs); await sendFrame(index, timeMs); }
        const diagnosticSamples = [0, 5000, 12000, 22000, Math.max(0, manifest.duration_ms - 300)].map((timeMs) => { const amplitude = Number(amplitudeAt(timeMs).toFixed(4)); return { time_ms: timeMs, amplitude, mouth_state: mouthStateAt(amplitude, true) }; });
        const complete = { mode: "vertical-story-v1", duration_ms: manifest.duration_ms, sample_rate: sampleRate, canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, timing_source: "measured_wav_segments", mouth_source: "pcm16_rms_envelope", rms_samples: diagnosticSamples, technical_overlay: false, word_phoneme_viseme_timing: "unavailable" };
        const response = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(complete) }); if (!response.ok) fail(`completion upload failed: ${response.status}`); status.textContent = JSON.stringify(complete); document.title = "completed";
      }
      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {}); });
    </script>
  </body>
</html>
