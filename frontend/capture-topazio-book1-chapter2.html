<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <title>Crônicas de Topázio · Capítulo 2</title>
    <style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style>
  </head>
  <body>
    <canvas id="capture-canvas"></canvas>
    <pre id="status">initializing</pre>
    <script type="module">
      import { NarratorAvatarRenderer, NARRATOR_FACE_CROP, createNarratorTimeline, validateNarratorManifest, segmentAt } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";

      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const timelineUrl = params.get("timeline");
      const fps = Number(params.get("fps") || 30);
      const chapterLabel = params.get("chapterLabel") || "CRÔNICAS DE TOPÁZIO";
      const chapterNumber = params.get("chapterNumber") || "";
      const captureMode = params.get("captureMode") || "cronicas-cinematic-production";
      const orientation = params.get("orientation") === "vertical" ? "vertical" : "horizontal";
      const canvas = document.querySelector("#capture-canvas");
      canvas.width = orientation === "vertical" ? 1080 : 1920;
      canvas.height = orientation === "vertical" ? 1920 : 1080;
      const context = canvas.getContext("2d");
      const WIDTH = canvas.width, HEIGHT = canvas.height;
      const status = document.querySelector("#status");
      document.title = chapterLabel;
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };

      function exportUrl(value) {
        const normalized = decodeURIComponent(String(value)).replaceAll("\\", "/");
        const marker = "/workspace/exports/";
        const index = normalized.toLowerCase().indexOf(marker);
        if (index < 0) throw new Error(`asset is outside workspace exports: ${value}`);
        const relative = normalized.slice(index + marker.length).replace(/^\/+/, "");
        const parts = relative.split("/");
        if (!relative || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe export asset: ${value}`);
        return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`;
      }
      async function readWav(url) {
        const response = await fetch(url); if (!response.ok) throw new Error(`audio request failed with HTTP ${response.status}`);
        return decodeMonoPcm16Wav(await response.arrayBuffer());
      }
      function sceneWeight(timeMs, scene, index, scenes, fadeMs) {
        if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0;
        let value = 1;
        if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) value = Math.min(value, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs);
        if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) value = Math.min(value, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs);
        return clamp(value);
      }
      function coverImage(image, timeMs, scene, alpha) {
        const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms));
        const base = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight);
        let zoom = 1.01, panX = 0, panY = 0;
        switch (scene.camera) {
          case "cave_entry": zoom = 1.01 + progress * .06; panX = progress * .02; break;
          case "crystal_drift": zoom = 1.03 + progress * .07; panX = -.02 + progress * .04; break;
          case "memory_fissure": zoom = 1.04 + progress * .12; panY = progress * .02; break;
          case "road_push": zoom = 1.01 + progress * .06; panX = progress * .03; break;
          case "elements_lateral": zoom = 1.04; panX = -.08 + progress * .16; break;
          case "temple_approach": zoom = 1.01 + progress * .08; panY = progress * .012; break;
          case "crack_pan": zoom = 1.05 + progress * .04; panX = -.04 + progress * .08; break;
          case "altar_push": zoom = 1.02 + progress * .11; panY = progress * .018; break;
          case "halo_pulse": zoom = 1.04 + progress * .065; break;
          case "reflection_drift": zoom = 1.03 + progress * .05; panX = progress * .04; break;
          case "shadow_cross": zoom = 1.06 - progress * .02; panX = progress * .025; break;
          case "path_return": zoom = 1.02 + progress * .05; panX = -.02 + progress * .04; break;
          case "seven_pulse": zoom = 1.04 + progress * .08; break;
          case "pillar_close": zoom = 1.02 + progress * .07; panY = -progress * .02; break;
          case "crystal_answer": zoom = 1.03 + progress * .06; panX = progress * .02; break;
          case "chapter_fade": zoom = 1.01 + progress * .03; panX = -progress * .015; break;
          case "host_closing": zoom = 1.015 + progress * .018; panX = -progress * .01; break;
          default: zoom = 1.01 + progress * .025;
        }
        const scale = base * zoom, width = image.naturalWidth * scale, height = image.naturalHeight * scale;
        const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH), y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT);
        context.save(); context.globalAlpha = alpha; context.drawImage(image, x, y, width, height);
        const pulse = (Math.sin(progress * Math.PI * 6) + 1) / 2;
        if (["altar_push", "halo_pulse", "seven_pulse", "crystal_answer"].includes(scene.camera)) {
          const glow = context.createRadialGradient(WIDTH * .54, HEIGHT * .40, 12, WIDTH * .54, HEIGHT * .40, 620);
          glow.addColorStop(0, `rgba(83,174,255,${.07 + pulse * .12})`); glow.addColorStop(1, "rgba(83,174,255,0)");
          context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT);
        }
        if (scene.camera === "elements_lateral" || scene.camera === "shadow_cross") { context.fillStyle = `rgba(12,16,42,${.025 + pulse * .045})`; context.fillRect(0, 0, WIDTH, HEIGHT); }
        context.restore();
      }
      function drawAtmosphere(scene, timeMs) {
        if (!scene || scene.kind !== "story") return;
        if (!["cave_entry", "crystal_drift", "elements_lateral", "road_push", "reflection_drift", "seven_pulse"].includes(scene.camera)) return;
        const tint = scene.camera === "elements_lateral" ? "#f2c77a" : "#b7e6ff";
        context.save(); context.globalAlpha = scene.camera === "elements_lateral" ? .12 : .18; context.fillStyle = tint;
        for (let index = 0; index < 26; index += 1) {
          const phase = index * 1.71, x = (index * 137 + timeMs * (.008 + (index % 3) * .002)) % WIDTH;
          const y = (index * 73 + Math.sin(timeMs / 800 + phase) * 22 + 70) % (HEIGHT - 120);
          context.beginPath(); context.arc(x, y, 1 + (index % 3) * .55, 0, Math.PI * 2); context.fill();
        }
        context.restore();
      }
      function wrap(text, maxWidth) {
        const words = String(text).split(/\s+/), lines = []; let line = ""; context.font = "600 29px Segoe UI";
        for (const word of words) { const candidate = line ? `${line} ${word}` : word; if (line && context.measureText(candidate).width > maxWidth) { lines.push(line); line = word; } else line = candidate; }
        if (line) lines.push(line); return lines;
      }
      function drawNarrator(avatar, timeMs, amplitude, mode) {
        const host = mode === "host";
        const x = orientation === "vertical" ? (host ? 74 : 42) : (host ? 74 : 48);
        const y = orientation === "vertical" ? (host ? 560 : 1370) : (host ? 538 : 760);
        const size = orientation === "vertical" ? (host ? 850 : 390) : (host ? 430 : 260);
        context.save(); context.fillStyle = "rgba(3,10,24,.72)"; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + 26, 0, Math.PI * 2); context.fill();
        context.strokeStyle = host ? "rgba(247,210,122,.92)" : "rgba(247,210,122,.84)"; context.lineWidth = host ? 6 : 4; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + (host ? 18 : 12), 0, Math.PI * 2); context.stroke(); context.restore();
        avatar.renderTo(context, { x, y, size, timeMs, speechAmplitude: amplitude, isPlaying: true, crop: NARRATOR_FACE_CROP }); return true;
      }
      function drawSubtitle(segment, narratorVisible) {
        if (!segment) return;
        const x = orientation === "vertical" ? 540 : (narratorVisible ? 1160 : 960);
        const width = orientation === "vertical" ? 930 : (narratorVisible ? 1450 : 1650);
        const y = orientation === "vertical" ? (narratorVisible ? 1120 : 1110) : 850;
        const lines = wrap(segment.text, width - 72), height = lines.length * 40 + 36;
        context.save(); context.fillStyle = "rgba(3,12,28,.86)"; context.fillRect(x - width / 2, y - 20, width, height); context.strokeStyle = "rgba(247,210,122,.78)"; context.lineWidth = 2; context.strokeRect(x - width / 2, y - 20, width, height);
        context.fillStyle = "#fff7dc"; context.textAlign = "center"; context.textBaseline = "top"; lines.forEach((line, index) => context.fillText(line, x, y + index * 40)); context.restore();
      }
      function drawTitle(timeMs) {
        const alpha = clamp(Math.min((4800 - timeMs) / 900, 1)); if (alpha <= 0) return;
        const vertical = orientation === "vertical"; const x = vertical ? 54 : 920; const y = vertical ? 90 : 96; const width = vertical ? 972 : 880; const right = vertical ? 1024 : 1738;
        context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.62)"; context.fillRect(x, y, width, vertical ? 190 : 150); context.textAlign = "right"; context.fillStyle = "#f7d27a"; context.font = vertical ? "700 25px Segoe UI" : "700 32px Segoe UI"; context.fillText("CRÔNICAS DE TOPÁZIO", right, y + 44); context.fillStyle = "#fff7dc"; context.font = vertical ? "700 34px Segoe UI" : "700 46px Segoe UI"; context.fillText(chapterLabel, right, y + 104); context.restore();
      }
      function drawEndCard(timeMs, durationMs) {
        const start = Math.max(0, durationMs - 5600); if (timeMs < start) return; const alpha = clamp((timeMs - start) / 900); const vertical = orientation === "vertical"; const x = vertical ? 54 : 1120; const y = vertical ? 90 : 80; const width = vertical ? 972 : 720; const right = vertical ? 1024 : 1785;
        context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.67)"; context.fillRect(x, y, width, vertical ? 164 : 144); context.textAlign = "right"; context.fillStyle = "#f7d27a"; context.font = vertical ? "700 24px Segoe UI" : "700 30px Segoe UI"; context.fillText("O DESPERTAR DOS CRISTAIS", right, y + 52); context.fillStyle = "#dcecff"; context.font = "22px Segoe UI"; context.fillText(`LIVRO 1 · CAPÍTULO ${chapterNumber}`, right, y + 104); context.restore();
      }
      function sendFrame(index, timeMs) { return new Promise((resolve, reject) => canvas.toBlob(async (blob) => { if (!blob) { reject(new Error("JPEG encoding failed")); return; } const url = `/capture/${encodeURIComponent(session)}/${String(index).padStart(6, "0")}.jpg`; let lastError = null; for (let attempt = 0; attempt < 4; attempt += 1) { try { const response = await fetch(url, { method: "POST", headers: { "Content-Type": "image/jpeg", "X-Frame-Time-Ms": String(timeMs) }, body: blob }); if (!response.ok) throw new Error(`frame upload failed with HTTP ${response.status}`); resolve(); return; } catch (error) { lastError = error; await new Promise((wait) => setTimeout(wait, 120 * (attempt + 1))); } } reject(lastError || new Error("frame upload failed")); }, "image/jpeg", .88)); }

      async function main() {
        if (!session || !timelineUrl) fail("session and timeline are required"); if (!Number.isInteger(fps) || fps <= 0 || fps > 60) fail("invalid fps");
        const timelineResponse = await fetch(timelineUrl); if (!timelineResponse.ok) fail(`timeline request failed with HTTP ${timelineResponse.status}`); const plan = await timelineResponse.json();
        if (plan.character_policy?.draft_rendering !== "blocked" || plan.character_policy?.approved_only !== true) fail("character policy is not locked");
        if (plan.scenes.some((scene) => scene.environment_only && scene.character_registry_id !== "santa-v5-base")) fail("unapproved story character in scene plan");
        const manifestResponse = await fetch(`/exports/${plan.manifest}`); if (!manifestResponse.ok) fail(`manifest request failed with HTTP ${manifestResponse.status}`); const manifest = await manifestResponse.json(); validateNarratorManifest(manifest);
        const wavs = await Promise.all(manifest.segments.map((segment) => readWav(exportUrl(segment.audio_uri)))); const sampleRate = wavs[0].sampleRate; if (wavs.some((wav) => wav.sampleRate !== sampleRate)) fail("WAV sample rates differ");
        const amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate), images = {};
        for (const scene of plan.scenes) { const image = document.createElement("img"); image.src = `/exports/${scene.image}`; await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`scene image failed: ${scene.image}`)); }); images[scene.id] = image; }
        const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load(); const timeline = createNarratorTimeline(manifest); const frameCount = Math.ceil(manifest.duration_ms / 1000 * fps); const pending = new Set();
        for (let index = 0; index < frameCount; index += 1) {
          const timeMs = Math.round(index * 1000 / fps); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#030914"; context.fillRect(0, 0, WIDTH, HEIGHT); let active = null;
          plan.scenes.forEach((scene, sceneIndex) => { const weight = sceneWeight(timeMs, scene, sceneIndex, plan.scenes, plan.transition_ms); if (weight > 0) { coverImage(images[scene.id], timeMs, scene, weight); if (!active || weight > active.weight) active = { scene, weight }; } });
          drawAtmosphere(active?.scene, timeMs); drawTitle(timeMs); const narratorMode = active?.scene?.kind === "host" ? "host" : "story"; const visible = drawNarrator(avatar, timeMs, amplitudeAt(timeMs), narratorMode); drawSubtitle(segmentAt(timeline, timeMs), visible); drawEndCard(timeMs, manifest.duration_ms);
          const upload = sendFrame(index, timeMs); pending.add(upload); upload.then(() => pending.delete(upload), () => pending.delete(upload)); if (pending.size >= 12) await Promise.race(pending);
        }
        await Promise.all(pending); const completion = { mode: captureMode, orientation, chapter_label: chapterLabel, duration_ms: manifest.duration_ms, sample_rate: sampleRate, canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, timing_source: "measured_wav_segments", mouth_source: "pcm16_rms_envelope", captions: "measured_segment_ranges", narrator_visibility: "all_scenes_medallion", narrator_renderer: "NarratorAvatarRenderer", library_asset_id: "santa-library-topazioverse-v1", approved_character_id: "santa-v5-base", draft_character_rendering: "blocked", story_visual_policy: "environment_only", word_phoneme_viseme_timing: "unavailable" };
        const response = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(completion) }); if (!response.ok) fail(`completion upload failed with HTTP ${response.status}`); status.textContent = JSON.stringify(completion); document.title = "completed";
      }
      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {}); });
    </script>
  </body>
</html>
