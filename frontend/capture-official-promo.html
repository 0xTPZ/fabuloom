<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"/><title>Fabuloom official promo capture</title><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style></head>
  <body><canvas id="capture-canvas" width="1080" height="1920"></canvas><span id="status">loading</span>
    <script type="module">
      import { NarratorAvatarRenderer, NARRATOR_FACE_CROP, createNarratorTimeline, segmentAt, mouthStateAt } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";
      import { validateOfficialPromoProfile, wrapSubtitleText } from "./src/official-promo-profile.mjs";
      const params = new URLSearchParams(location.search); const session = params.get("session"); const profileUrl = params.get("profile"); const fps = Number(params.get("fps") || 30); const canvas = document.querySelector("#capture-canvas"); const context = canvas.getContext("2d"); const WIDTH = canvas.width; const HEIGHT = canvas.height; const status = document.querySelector("#status");
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message, stack: String(new Error(message).stack || "") }) }).catch(() => {}); throw new Error(message); };
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const safeAssetUrl = (relative) => { if (typeof relative !== "string" || relative.startsWith("/") || relative.includes("\\") || relative.split("/").some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe asset path: ${relative}`); return new URL(`/exports/${relative}`, location.origin).href; };
      const readWav = async (url) => { const response = await fetch(url); if (!response.ok) throw new Error(`WAV request failed: ${response.status}`); return decodeMonoPcm16Wav(await response.arrayBuffer()); };
      const loadImage = async (url, label) => { const image = document.createElement("img"); image.src = url; await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`image failed: ${label}`)); }); return image; };
      function sceneAt(scenes, timeMs) { return scenes.find((scene) => timeMs >= scene.start_ms && timeMs < scene.end_ms) || scenes[scenes.length - 1]; }
      function sceneWeight(timeMs, scene, index, scenes, fadeMs) { if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0; let value = 1; if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) value = Math.min(value, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs); if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) value = Math.min(value, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs); return clamp(value); }
      function cover(image, timeMs, scene, alpha) { const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms)); const scale = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight) * (1 + (scene.camera === "zoom" ? progress * .10 : .025)); const width = image.naturalWidth * scale; const height = image.naturalHeight * scale; let panX = 0; let panY = 0; if (scene.camera === "pan-up") panY = .12 - progress * .24; if (scene.camera === "pan-side") panX = -.10 + progress * .20; const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH); const y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT); context.save(); context.globalAlpha = alpha; context.drawImage(image, x, y, width, height); context.restore(); }
      function contain(image, bounds, alpha = 1) { const scale = Math.min(bounds.width / image.naturalWidth, bounds.height / image.naturalHeight); const width = image.naturalWidth * scale; const height = image.naturalHeight * scale; context.save(); context.globalAlpha = alpha; context.drawImage(image, bounds.x + (bounds.width - width) / 2, bounds.y + (bounds.height - height) / 2, width, height); context.restore(); }
      function panel(x, y, width, height, fill = "rgba(3,12,28,.86)") { context.fillStyle = fill; context.fillRect(x, y, width, height); context.strokeStyle = "rgba(247,210,122,.82)"; context.lineWidth = 2; context.strokeRect(x, y, width, height); }
      function text(value, x, y, font, color = "#fff7dc", align = "left") { context.font = font; context.fillStyle = color; context.textAlign = align; context.textBaseline = "top"; context.fillText(value, x, y); }
      function drawGradient() { const gradient = context.createLinearGradient(0, 0, 0, HEIGHT); gradient.addColorStop(0, "rgba(1,6,17,.10)"); gradient.addColorStop(.6, "rgba(1,6,17,.16)"); gradient.addColorStop(1, "rgba(1,4,12,.76)"); context.fillStyle = gradient; context.fillRect(0, 0, WIDTH, HEIGHT); }
      function drawParticles(timeMs) { context.save(); context.globalAlpha = .32; for (let index = 0; index < 26; index += 1) { const x = (Math.sin(index * 17.3 + timeMs * .0007) * .5 + .5) * WIDTH; const y = (index * 97 + timeMs * (.018 + index * .0008)) % HEIGHT; context.fillStyle = index % 2 ? "#8bcaff" : "#f7d27a"; context.beginPath(); context.arc(x, y, 1.2 + index % 3, 0, Math.PI * 2); context.fill(); } context.restore(); }
      function drawIntro(pageImage, timeMs) { const progress = clamp((timeMs - 300) / 1800); if (progress < 1) { context.save(); context.globalAlpha = 1 - progress; panel(90, 430, 900, 860, "rgba(245,247,250,.96)"); text("ROTEIRO", 540, 590, "700 42px Segoe UI", "#16335b", "center"); context.strokeStyle = "#b78336"; context.lineWidth = 3; context.beginPath(); context.moveTo(210, 700); context.lineTo(870, 700); context.moveTo(210, 800); context.lineTo(760, 800); context.moveTo(210, 900); context.lineTo(830, 900); context.stroke(); text("palavras → cenas → voz", 540, 1080, "600 30px Segoe UI", "#39618f", "center"); context.restore(); } if (progress > .25) { context.save(); context.globalAlpha = clamp((progress - .25) / .75); contain(pageImage, { x: 65, y: 170, width: 950, height: 1450 }); context.restore(); } }
      function drawScreenEvidence(image, profile, timeMs) { const progress = clamp((timeMs - profile.scenes[2].start_ms) / Math.max(1, profile.scenes[2].end_ms - profile.scenes[2].start_ms)); panel(48, 265, 984, 760, "rgba(4,13,29,.94)"); contain(image, { x: 80, y: 300, width: 920, height: 515 }); panel(82, 842, 916, 144, "rgba(7,23,46,.96)"); text("DEMONSTRAÇÃO LOCAL REAL", 112, 866, "700 25px Segoe UI", "#f7d27a"); text("Fabuloom Studio · Character Stage · captura no navegador", 112, 906, "500 24px Segoe UI", "#dcecff"); text("perfil vertical-story-v1  ·  render concluído", 112, 944, "500 22px Segoe UI", "#8bcaff"); context.fillStyle = "#f7d27a"; context.fillRect(88, 1002, 900 * progress, 5); }
      function drawResults(image, timeMs, scene) { const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms)); panel(42, 245, 996, 1030, "rgba(3,10,24,.92)"); contain(image, { x: 72, y: 280, width: 936, height: 820 }); text("RESULTADO PRODUZIDO PELO FABULOOM", 540, 1130, "700 28px Segoe UI", "#f7d27a", "center"); text("cenas · narração · personagem · legendas · exportação", 540, 1176, "500 23px Segoe UI", "#dcecff", "center"); context.strokeStyle = `rgba(139,202,255,${.45 + .35 * Math.sin(progress * Math.PI)})`; context.lineWidth = 5; context.strokeRect(72, 280, 936, 820); }
      function drawCommunity(scene) { context.save(); panel(70, 520, 940, 580, "rgba(3,12,28,.90)"); text("GRATUITO · OPEN SOURCE", 540, 625, "700 43px Segoe UI", "#f7d27a", "center"); text("Primeira fase pública", 540, 725, "600 31px Segoe UI", "#dcecff", "center"); text("sugestões · ideias · bugs · contribuições", 540, 805, "500 28px Segoe UI", "#8bcaff", "center"); text("CONTRIBUA NO GITHUB", 540, 930, "700 34px Segoe UI", "#fff7dc", "center"); text("github.com/0xTPZ/fabuloom", 540, 990, "500 27px Segoe UI", "#f7d27a", "center"); context.restore(); }
      function drawEnd(profile, logo, timeMs) { const progress = clamp((timeMs - (profile.duration_ms - 2600)) / 2600); context.save(); context.globalAlpha = progress; context.fillStyle = "rgba(0,2,8,.87)"; context.fillRect(0, 0, WIDTH, HEIGHT); if (logo) contain(logo, { x: 235, y: 470, width: 610, height: 180 }); text("FABULOOM STUDIO", 540, 780, "700 54px Segoe UI", "#f7d27a", "center"); text("Dê vida às suas histórias.", 540, 880, "500 34px Segoe UI", "#dcecff", "center"); text("Um projeto open source criado por 0xTPZ", 540, 1010, "500 27px Segoe UI", "#fff7dc", "center"); text("github.com/0xTPZ/fabuloom", 540, 1110, "500 26px Segoe UI", "#8bcaff", "center"); context.restore(); }
      function drawOnScreenLabel(value) { let fontSize = 47; context.save(); do { context.font = `700 ${fontSize}px Segoe UI`; if (context.measureText(value).width <= 960 || fontSize <= 27) break; fontSize -= 2; } while (fontSize > 27); text(value, 540, 150, `700 ${fontSize}px Segoe UI`, "#f7d27a", "center"); context.restore(); }
      function drawSubtitle(segment, profile) { if (!segment) return; const s = profile.subtitles; let fontSize = s.font_size; let lines = []; do { lines = wrapSubtitleText(segment.text, Math.max(26, Math.round(s.width / (fontSize * .58)))); if (lines.length > 4) fontSize -= 2; else break; } while (fontSize >= 22); const lineHeight = Math.max(31, fontSize + 8); const height = lines.length * lineHeight + 38; const x = s.x - s.width / 2; const y = s.y - height / 2; panel(x, y, s.width, height, "rgba(3,12,28,.88)"); lines.forEach((line, index) => text(line, s.x, y + 18 + index * lineHeight, `700 ${fontSize}px Segoe UI`, "#fff7dc", "center")); }
      async function sendFrame(index, timeMs) { const blob = await new Promise((resolve, reject) => canvas.toBlob((value) => value ? resolve(value) : reject(new Error("PNG encoding failed")), "image/png")); const response = await fetch(`/capture/${encodeURIComponent(session)}/${String(index).padStart(6, "0")}.png`, { method: "POST", headers: { "Content-Type": "image/png", "X-Frame-Time-Ms": String(timeMs) }, body: blob }); if (!response.ok) throw new Error(`frame upload failed: ${response.status}`); }
      async function main() { if (!session || !profileUrl) fail("session and profile are required"); if (fps !== 30) fail("official promo requires 30 FPS"); const response = await fetch(profileUrl); if (!response.ok) fail(`profile request failed: ${response.status}`); const profile = validateOfficialPromoProfile(await response.json()); const manifestResponse = await fetch(safeAssetUrl(profile.audio.manifest)); if (!manifestResponse.ok) fail(`manifest request failed: ${manifestResponse.status}`); const manifest = await manifestResponse.json(); const projectRoot = profile.audio.manifest.split("/")[0]; const wavs = await Promise.all(manifest.segments.map((segment) => readWav(safeAssetUrl(`${projectRoot}/${String(segment.audio_uri).split(/[\\/]/).pop()}`)))); const sampleRate = wavs[0].sampleRate; const amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate); const timeline = createNarratorTimeline(manifest); const images = {}; for (const scene of profile.scenes) images[scene.id] = await loadImage(safeAssetUrl(scene.image), scene.image); const resultsImage = await loadImage(safeAssetUrl(profile.evidence.results_board), "results board"); const logo = await loadImage(new URL("./assets/logo.svg", location.href).href, "logo").catch(() => null); const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load(); const frameCount = Math.ceil(manifest.duration_ms / 1000 * fps); for (let index = 0; index < frameCount; index += 1) { const timeMs = Math.round(index * 1000 / fps); const current = sceneAt(profile.scenes, timeMs); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#030914"; context.fillRect(0, 0, WIDTH, HEIGHT); profile.scenes.forEach((scene, sceneIndex) => { const weight = sceneWeight(timeMs, scene, sceneIndex, profile.scenes, profile.transitions.crossfade_ms); if (weight <= 0) return; if (scene.kind === "screen") { cover(images[scene.id], timeMs, scene, weight); drawScreenEvidence(images[scene.id], profile, timeMs); } else if (scene.kind === "results") { cover(images[scene.id], timeMs, scene, weight); drawResults(resultsImage, timeMs, scene); } else { cover(images[scene.id], timeMs, scene, weight); } }); if (current.kind === "intro") drawIntro(images[current.id], timeMs); if (current.kind === "community") drawCommunity(current, timeMs); if (current.kind === "end") drawEnd({ ...profile, duration_ms: manifest.duration_ms }, logo, timeMs); drawGradient(); if (current.effect === "particles") drawParticles(timeMs); if (profile.narrator.visible_in.includes(current.id)) avatar.renderTo(context, { x: profile.narrator.x, y: profile.narrator.y, size: profile.narrator.size, timeMs, speechAmplitude: amplitudeAt(timeMs), isPlaying: true, crop: NARRATOR_FACE_CROP }); drawSubtitle(segmentAt(timeline, timeMs), profile); if (current.on_screen) drawOnScreenLabel(current.on_screen); await sendFrame(index, timeMs); } const samples = [0, 5000, 12000, Math.max(0, manifest.duration_ms - 400)].map((timeMs) => { const amplitude = Number(amplitudeAt(timeMs).toFixed(4)); return { time_ms: timeMs, amplitude, mouth_state: mouthStateAt(amplitude, true) }; }); const complete = { mode: "official-promo-v1", duration_ms: manifest.duration_ms, sample_rate: sampleRate, canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, timing_source: "measured_wav_segments", mouth_source: "pcm16_rms_envelope", rms_samples: samples, technical_overlay: false, word_phoneme_viseme_timing: "unavailable" }; const completeResponse = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(complete) }); if (!completeResponse.ok) fail(`completion upload failed: ${completeResponse.status}`); status.textContent = JSON.stringify(complete); document.title = "completed"; }
      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; });
    </script>
  </body>
</html>
