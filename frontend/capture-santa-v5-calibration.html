<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Santa V5 rig calibration capture</title>
    <style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style>
  </head>
  <body>
    <canvas id="capture-canvas" width="1080" height="1920"></canvas>
    <pre id="status">initializing</pre>
    <script type="module">
      import { captureLayeredFrames, LayeredCharacterRenderer } from "./src/layered-character.ts";
      import { SantaV5Rig } from "./src/santa-v5-engine.ts";
      import { SANTA_V5_PACK } from "./src/santa-v5-pack.mjs";
      import { validateCharacterPack } from "./src/character-pack.mjs";

      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const fps = Number(params.get("fps") || 30);
      const durationMs = 8000;
      const status = document.querySelector("#status");
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };

      function drawBackdrop(ctx, width, height) {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#0a1730"); gradient.addColorStop(0.62, "#172f50"); gradient.addColorStop(1, "#070c17");
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(247,210,122,.12)"; ctx.beginPath(); ctx.arc(width * .72, height * .22, 210, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(247,210,122,.82)"; ctx.beginPath(); ctx.arc(width * .72, height * .22, 74, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.55)";
        for (let index = 0; index < 20; index += 1) { const x = (index * 173) % width; const y = 90 + ((index * 97) % 860); ctx.fillRect(x, y, index % 3 === 0 ? 5 : 3, index % 3 === 0 ? 5 : 3); }
        ctx.fillStyle = "rgba(247,210,122,.15)"; ctx.fillRect(0, height * .84, width, 5);
      }

      async function blobFromFrame(renderer, outputCanvas) {
        drawBackdrop(outputCanvas.getContext("2d"), outputCanvas.width, outputCanvas.height);
        outputCanvas.getContext("2d").drawImage(renderer.canvas, 0, 0);
        return new Promise((resolve, reject) => outputCanvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("frame encoding returned no blob")), "image/png"));
      }

      async function sendFrame({ index, timeMs, blob }) {
        const response = await fetch(`/capture/${encodeURIComponent(session)}/${String(index).padStart(6, "0")}.png`, { method: "POST", headers: { "Content-Type": "image/png", "X-Frame-Time-Ms": String(timeMs) }, body: blob });
        if (!response.ok) throw new Error(`frame ${index} upload failed with HTTP ${response.status}`);
      }

      async function main() {
        if (!session) fail("session is required");
        if (!Number.isInteger(fps) || fps <= 0 || fps > 60) fail("invalid fps");
        validateCharacterPack(SANTA_V5_PACK);
        const outputCanvas = document.querySelector("#capture-canvas");
        const characterCanvas = document.createElement("canvas"); characterCanvas.width = outputCanvas.width; characterCanvas.height = outputCanvas.height;
        const rig = new SantaV5Rig(); rig.setSceneDuration(durationMs); rig.setSpeechAmplitude(0.42);
        const renderer = new LayeredCharacterRenderer(characterCanvas, rig, SANTA_V5_PACK, { assetRoot: new URL("./", location.href).href, renderBackground: false });
        await renderer.load();
        const result = await captureLayeredFrames(renderer, {
          durationMs, fps, isPlaying: true,
          amplitudeAt: (timeMs) => 0.18 + Math.max(0, Math.sin(timeMs / 1000 * Math.PI * 2.7)) * 0.30,
          onFrame: async ({ index, timeMs }) => sendFrame({ index, timeMs, blob: await blobFromFrame(renderer, outputCanvas) }),
        });
        const completion = { character: SANTA_V5_PACK.id, duration_ms: durationMs, canvas: { width: outputCanvas.width, height: outputCanvas.height }, fps, frame_count: result.frameCount, animation_format: "fabuloom.animation/0.1", timing_source: "absolute_rig_time", audio: "none", purpose: "visual_rig_calibration" };
        const complete = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(completion) });
        if (!complete.ok) fail(`completion upload failed with HTTP ${complete.status}`);
        status.textContent = JSON.stringify(completion); document.title = "completed";
      }
      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {}); });
    </script>
  </body>
</html>
