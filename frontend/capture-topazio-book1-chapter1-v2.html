<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <title>Crônicas de Topázio · Capítulo 1</title>
    <style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#status{display:none}</style>
  </head>
  <body>
    <canvas id="capture-canvas" width="1920" height="1080"></canvas>
    <pre id="status">initializing</pre>
    <script type="module">
      import {
        NarratorAvatarRenderer,
        NARRATOR_FACE_CROP,
        createNarratorTimeline,
        validateNarratorManifest,
        segmentAt
      } from "./src/narrator-mode.mjs";
      import { decodeMonoPcm16Wav, composePcmSegments, createRmsReader } from "./src/cinematic-audio.mjs";

      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const timelineUrl = params.get("timeline");
      const fps = Number(params.get("fps") || 30);
      const canvas = document.querySelector("#capture-canvas");
      const context = canvas.getContext("2d");
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const status = document.querySelector("#status");
      const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
      const fail = (message) => { status.textContent = `error: ${message}`; document.title = `error: ${message}`; throw new Error(message); };

      function exportUrl(value) {
        const normalized = decodeURIComponent(String(value)).replaceAll("\\", "/");
        const marker = "/workspace/exports/";
        const index = normalized.toLowerCase().indexOf(marker);
        if (index < 0) throw new Error(`asset is outside workspace exports: ${value}`);
        const relative = normalized.slice(index + marker.length).replace(/^\/+/, "");
        const parts = relative.split("/");
        if (!relative || parts.some((part) => !part || part === "." || part === "..")) throw new Error(`unsafe export asset: ${value}`);
        return `/exports/${parts.map((part) => encodeURIComponent(part)).join("/")}`;
      }

      async function readWav(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`audio request failed with HTTP ${response.status}`);
        return decodeMonoPcm16Wav(await response.arrayBuffer());
      }

      function sceneWeight(timeMs, scene, index, scenes, fadeMs) {
        if (timeMs < scene.start_ms - fadeMs / 2 || timeMs > scene.end_ms + fadeMs / 2) return 0;
        let value = 1;
        if (index > 0 && timeMs < scene.start_ms + fadeMs / 2) value = Math.min(value, (timeMs - scene.start_ms + fadeMs / 2) / fadeMs);
        if (index < scenes.length - 1 && timeMs > scene.end_ms - fadeMs / 2) value = Math.min(value, (scene.end_ms + fadeMs / 2 - timeMs) / fadeMs);
        return clamp(value);
      }

      function coverImage(image, timeMs, scene, alpha) {
        const progress = clamp((timeMs - scene.start_ms) / Math.max(1, scene.end_ms - scene.start_ms));
        const base = Math.max(WIDTH / image.naturalWidth, HEIGHT / image.naturalHeight);
        let zoom = 1.01, panX = 0, panY = 0;
        switch (scene.camera) {
          case "frozen_river": zoom = 1.02 + progress * .06; panX = progress * .025; break;
          case "crystal_approach": zoom = 1.02 + progress * .11; panY = progress * .018; break;
          case "cave_push": zoom = 1.02 + progress * .08; panX = progress * .02; break;
          case "wind_lateral": zoom = 1.04; panX = -.07 + progress * .14; panY = progress * .012; break;
          case "snow_breath": zoom = 1.02 + progress * .06; panX = -progress * .02; break;
          case "water_drift": zoom = 1.03 + progress * .05; panX = -.025 + progress * .05; break;
          case "ember_pulse": zoom = 1.04 + progress * .045; panY = -progress * .01; break;
          case "fire_pan": zoom = 1.02 + progress * .05; panX = -.02 + progress * .04; break;
          case "ash_pull": zoom = 1.06 - progress * .02; panX = progress * .02; break;
          case "crystal_pulse": zoom = 1.04 + progress * .07; break;
          case "host_closing": zoom = 1.015 + progress * .018; panX = -progress * .01; break;
          default: zoom = 1.01 + progress * .025;
        }
        const scale = base * zoom;
        const width = image.naturalWidth * scale;
        const height = image.naturalHeight * scale;
        const x = (WIDTH - width) / 2 + panX * Math.max(0, width - WIDTH);
        const y = (HEIGHT - height) / 2 + panY * Math.max(0, height - HEIGHT);
        context.save();
        context.globalAlpha = alpha;
        context.drawImage(image, x, y, width, height);
        const pulse = (Math.sin(progress * Math.PI * 6) + 1) / 2;
        if (["crystal_approach", "crystal_pulse"].includes(scene.camera)) {
          const glow = context.createRadialGradient(WIDTH * .53, HEIGHT * .40, 12, WIDTH * .53, HEIGHT * .40, 620);
          glow.addColorStop(0, `rgba(83,174,255,${.08 + pulse * .13})`);
          glow.addColorStop(1, "rgba(83,174,255,0)");
          context.fillStyle = glow; context.fillRect(0, 0, WIDTH, HEIGHT);
        }
        if (scene.camera === "ember_pulse" || scene.camera === "fire_pan") {
          context.fillStyle = `rgba(255,137,56,${.025 + pulse * .045})`; context.fillRect(0, 0, WIDTH, HEIGHT);
        }
        context.restore();
      }

      function drawAtmosphere(scene, timeMs) {
        if (!scene || scene.kind !== "story") return;
        const alpha = scene.camera === "snow_breath" ? .34 : scene.camera === "water_drift" ? .16 : .2;
        if (!["snow_breath", "water_drift", "cave_push", "wind_lateral"].includes(scene.camera)) return;
        context.save(); context.globalAlpha = alpha; context.fillStyle = scene.camera === "snow_breath" ? "#e5f3ff" : "#b7e6ff";
        for (let index = 0; index < 30; index += 1) {
          const phase = index * 1.71;
          const x = (index * 137 + timeMs * (.008 + (index % 3) * .002)) % WIDTH;
          const y = (index * 73 + Math.sin(timeMs / 800 + phase) * 22 + 70) % (HEIGHT - 120);
          context.beginPath(); context.arc(x, y, 1 + (index % 3) * .55, 0, Math.PI * 2); context.fill();
        }
        context.restore();
      }

      function wrap(text, maxWidth) {
        const words = String(text).split(/\s+/); const lines = []; let line = "";
        context.font = "600 29px Segoe UI";
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (line && context.measureText(candidate).width > maxWidth) { lines.push(line); line = word; } else line = candidate;
        }
        if (line) lines.push(line); return lines;
      }

      function drawNarrator(avatar, timeMs, amplitude, mode) {
        if (!mode) return false;
        const host = mode === "host";
        const x = host ? 74 : 48;
        const y = host ? 538 : 760;
        const size = host ? 430 : 260;
        context.save(); context.fillStyle = "rgba(3,10,24,.72)"; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + 26, 0, Math.PI * 2); context.fill();
        context.strokeStyle = host ? "rgba(247,210,122,.92)" : "rgba(247,210,122,.84)"; context.lineWidth = host ? 6 : 4; context.beginPath(); context.arc(x + size / 2, y + size / 2, size / 2 + (host ? 18 : 12), 0, Math.PI * 2); context.stroke(); context.restore();
        avatar.renderTo(context, { x, y, size, timeMs, speechAmplitude: amplitude, isPlaying: true, crop: NARRATOR_FACE_CROP });
        return true;
      }

      function drawSubtitle(segment, narratorVisible) {
        if (!segment) return;
        const x = narratorVisible ? 1160 : 960; const width = narratorVisible ? 1450 : 1650; const y = 850;
        const lines = wrap(segment.text, width - 72); const height = lines.length * 40 + 36;
        context.save(); context.fillStyle = "rgba(3,12,28,.86)"; context.fillRect(x - width / 2, y - 20, width, height);
        context.strokeStyle = "rgba(247,210,122,.78)"; context.lineWidth = 2; context.strokeRect(x - width / 2, y - 20, width, height);
        context.fillStyle = "#fff7dc"; context.textAlign = "center"; context.textBaseline = "top";
        lines.forEach((line, index) => context.fillText(line, x, y + index * 40)); context.restore();
      }

      function drawTitle(timeMs) {
        const alpha = clamp(Math.min((4800 - timeMs) / 900, 1)); if (alpha <= 0) return;
        context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.62)"; context.fillRect(920, 96, 880, 150);
        context.textAlign = "right"; context.fillStyle = "#f7d27a"; context.font = "700 32px Segoe UI"; context.fillText("CRÔNICAS DE TOPÁZIO", 1738, 140);
        context.fillStyle = "#fff7dc"; context.font = "700 46px Segoe UI"; context.fillText("O DESPERTAR DOS CRISTAIS", 1738, 194);
        context.restore();
      }

      function drawEndCard(timeMs, durationMs) {
        const start = Math.max(0, durationMs - 5600); if (timeMs < start) return;
        const alpha = clamp((timeMs - start) / 900); context.save(); context.globalAlpha = alpha; context.fillStyle = "rgba(3,10,24,.67)"; context.fillRect(1120, 80, 720, 144);
        context.textAlign = "right"; context.fillStyle = "#f7d27a"; context.font = "700 30px Segoe UI"; context.fillText("O DESPERTAR DOS CRISTAIS", 1785, 132);
        context.fillStyle = "#dcecff"; context.font = "22px Segoe UI"; context.fillText("LIVRO 1 · CAPÍTULO 1", 1785, 174); context.restore();
      }

      function sendFrame(index, timeMs) {
        return new Promise((resolve, reject) => canvas.toBlob(async (blob) => {
          if (!blob) { reject(new Error("JPEG encoding failed")); return; }
          try {
            const response = await fetch(`/capture/${encodeURIComponent(session)}/${String(index).padStart(6, "0")}.jpg`, { method: "POST", headers: { "Content-Type": "image/jpeg", "X-Frame-Time-Ms": String(timeMs) }, body: blob });
            if (!response.ok) throw new Error(`frame upload failed with HTTP ${response.status}`); resolve();
          } catch (error) { reject(error); }
        }, "image/jpeg", .88));
      }

      async function main() {
        if (!session || !timelineUrl) fail("session and timeline are required");
        if (!Number.isInteger(fps) || fps <= 0 || fps > 60) fail("invalid fps");
        const timelineResponse = await fetch(timelineUrl); if (!timelineResponse.ok) fail(`timeline request failed with HTTP ${timelineResponse.status}`);
        const plan = await timelineResponse.json();
        const manifestResponse = await fetch(`/exports/${plan.manifest}`); if (!manifestResponse.ok) fail(`manifest request failed with HTTP ${manifestResponse.status}`);
        const manifest = await manifestResponse.json(); validateNarratorManifest(manifest);
        const wavs = await Promise.all(manifest.segments.map((segment) => readWav(exportUrl(segment.audio_uri))));
        const sampleRate = wavs[0].sampleRate; if (wavs.some((wav) => wav.sampleRate !== sampleRate)) fail("WAV sample rates differ");
        const amplitudeAt = createRmsReader(composePcmSegments(manifest, wavs, sampleRate), sampleRate);
        const images = {};
        for (const scene of plan.scenes) {
          const image = document.createElement("img"); image.src = `/exports/${scene.image}`;
          await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error(`scene image failed: ${scene.image}`)); });
          images[scene.id] = image;
        }
        const avatar = new NarratorAvatarRenderer(canvas, { assetRoot: new URL("./", location.href).href }); await avatar.load();
        const timeline = createNarratorTimeline(manifest); const frameCount = Math.ceil(manifest.duration_ms / 1000 * fps); const pending = new Set();
        for (let index = 0; index < frameCount; index += 1) {
          const timeMs = Math.round(index * 1000 / fps); context.clearRect(0, 0, WIDTH, HEIGHT); context.fillStyle = "#030914"; context.fillRect(0, 0, WIDTH, HEIGHT);
          let active = null;
          plan.scenes.forEach((scene, sceneIndex) => { const weight = sceneWeight(timeMs, scene, sceneIndex, plan.scenes, plan.transition_ms); if (weight > 0) { coverImage(images[scene.id], timeMs, scene, weight); if (!active || weight > active.weight) active = { scene, weight }; } });
          drawAtmosphere(active?.scene, timeMs); drawTitle(timeMs);
          const narratorMode = active?.scene ? (active.scene.kind === "host" ? "host" : "story") : "story";
          const visible = drawNarrator(avatar, timeMs, amplitudeAt(timeMs), narratorMode);
          drawSubtitle(segmentAt(timeline, timeMs), visible); drawEndCard(timeMs, manifest.duration_ms);
          if (visible || index % 4 === 0) {
            const upload = sendFrame(index, timeMs); pending.add(upload); upload.then(() => pending.delete(upload), () => pending.delete(upload));
            if (pending.size >= 12) await Promise.race(pending);
          }
        }
        await Promise.all(pending);
        const completion = { mode: "topazio-book1-chapter1-cronicas-v2", duration_ms: manifest.duration_ms, sample_rate: sampleRate, canvas: { width: WIDTH, height: HEIGHT }, fps, frame_count: frameCount, timing_source: "measured_wav_segments", mouth_source: "pcm16_rms_envelope", captions: "measured_segment_ranges", narrator_visibility: "all_scenes_medallion", narrator_renderer: "NarratorAvatarRenderer", library_asset_id: "santa-library-topazioverse-v1", word_phoneme_viseme_timing: "unavailable" };
        const response = await fetch(`/capture/${encodeURIComponent(session)}/complete.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(completion) });
        if (!response.ok) fail(`completion upload failed with HTTP ${response.status}`); status.textContent = JSON.stringify(completion); document.title = "completed";
      }

      main().catch((error) => { console.error(error); status.textContent = `error: ${error.message}`; document.title = `error: ${error.message}`; if (session) fetch(`/capture/${encodeURIComponent(session)}/error.json`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: String(error.message || error), stack: String(error.stack || "") }) }).catch(() => {}); });
    </script>
  </body>
</html>
