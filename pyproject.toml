[project]
name = "fabuloom-core"
version = "0.1.0"
description = "Versioned contracts and deterministic local core for Fabuloom Studio"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
    "numpy",
    "soundfile==0.14.0",
]

[tool.fabuloom]
format-version = "0.1.0"
