[project]
name = "fabuloom-core"
version = "0.1.0"
description = "Versioned contracts and deterministic local core for Fabuloom Studio"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
    "numpy",
    "soundfile==0.14.0",
]

[project.scripts]
fabuloom = "fabuloom_core.cli:main"
fabuloom-mcp = "fabuloom_core.mcp:main"

[tool.fabuloom]
format-version = "0.1.0"
